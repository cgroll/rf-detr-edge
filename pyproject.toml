[project]
name = "rfe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cgroll", email = "groll.christian.edu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.66.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "onnx>=1.17,<1.18",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=12.1.0",
    "rfdetr[onnxexport]>=1.3.0",
    "torch>=2.4,<2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfe"]
